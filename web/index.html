<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
<title data-i18n="Git Tree · 提交历史">Git Tree · 提交历史</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <a class="brand" href="/" aria-label="Git Tree 首页" data-i18n-aria-label="Git Tree 首页"><span class="brand-icon">⑂</span><span>Git Tree<small>LOCAL REPOSITORY EXPLORER</small></span></a>
    <form id="repoForm" class="pathbox"><label for="repoInput" data-i18n="仓库">仓库</label><input id="repoInput" spellcheck="false" placeholder="输入本地 Git 仓库路径" data-i18n-placeholder="输入本地 Git 仓库路径" aria-label="本地仓库路径" data-i18n-aria-label="本地仓库路径"><button id="loadBtn" type="submit"><span data-i18n="打开仓库">打开仓库</span> <span>↗</span></button></form>
    <button id="sourceAccessBtn" class="source-access" aria-pressed="false" aria-haspopup="dialog"><i></i><span id="sourceAccessLabel">源仓库只读</span></button>
    <select id="languageSelect" class="language-select" aria-label="Language / 语言"><option value="zh-CN" data-i18n="中文">中文</option><option value="en">English</option></select>
  </header>
  <section class="overview"><div><div class="eyebrow">REPOSITORY / HISTORY</div><h1 id="repoName">提交历史</h1><div id="repoMeta">每一条分支，都有迹可循。</div></div><div id="stats" class="stats" aria-label="仓库统计" data-i18n-aria-label="仓库统计"></div></section>
  <nav class="toolbar" aria-label="历史工具" data-i18n-aria-label="历史工具">
    <div class="history-title"><span class="live-dot"></span> <span data-i18n="提交图谱">提交图谱</span> <span id="commitCount" class="count">0</span></div>
    <div id="typeFilters" class="type-filters" role="group" aria-label="提交类型筛选，支持多选" data-i18n-aria-label="提交类型筛选，支持多选"></div>
    <span id="filterCount" class="filter-count" role="status"></span>
    <label class="sort-control" for="sortSelect"><span data-i18n="排序">排序</span><select id="sortSelect" aria-label="提交排序" data-i18n-aria-label="提交排序"><option value="date-desc" data-i18n="从新到旧">从新到旧</option><option value="date-asc" data-i18n="从旧到新">从旧到新</option><option value="edits-desc" data-i18n="编辑量：从大到小">编辑量：从大到小</option><option value="edits-asc" data-i18n="编辑量：从小到大">编辑量：从小到大</option><option value="files-desc" data-i18n="涉及文件：从多到少">涉及文件：从多到少</option><option value="files-asc" data-i18n="涉及文件：从少到多">涉及文件：从少到多</option></select></label>
    <span id="sortStatus" class="sort-status" role="status"></span>
    <div class="searchbox"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="搜索提交、作者、哈希…" data-i18n-placeholder="搜索提交、作者、哈希…" aria-label="搜索提交" data-i18n-aria-label="搜索提交"><span id="searchCount"></span><button id="searchNext" class="icon-button" aria-label="下一个搜索结果" data-i18n-aria-label="下一个搜索结果" title="下一个结果 / Enter" data-i18n-title="下一个结果 / Enter">↓</button></div>
    <button id="headBtn" class="quiet-button">◎ <span data-i18n="定位 HEAD">定位 HEAD</span></button>
    <button id="undoTagsBtn" class="quiet-button" disabled title="撤回当前仓库中本软件创建的所有标签，保留手动标签及后来被修改的标签" data-i18n-title="撤回当前仓库中本软件创建的所有标签，保留手动标签及后来被修改的标签">↶ <span data-i18n="撤回软件标签">撤回软件标签</span> <span id="ownedTagCount">0</span></button>
  </nav>
  <main id="stage">
    <section id="history" aria-label="Git 提交图谱" data-i18n-aria-label="Git 提交图谱">
      <div class="graph-caption"><span id="mainLabel">主分支</span></div>
      <div id="scroller" tabindex="0" aria-label="提交历史，使用上下方向键选择，Escape 关闭详情" data-i18n-aria-label="提交历史，使用上下方向键选择，Escape 关闭详情">
        <svg id="graph" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Git 提交关系图" data-i18n-aria-label="Git 提交关系图"></svg>
        <div id="emptyState" class="empty-state" hidden><span>⑂</span><h2 data-i18n="打开一段提交历史">打开一段提交历史</h2><p data-i18n="在上方输入本地 Git 仓库的路径。">在上方输入本地 Git 仓库的路径。</p></div>
      </div>
      <footer class="graph-footer"><div><span class="legend-dot"></span> <span data-i18n="提交">提交</span> <span class="legend-merge"></span> <span data-i18n="合并">合并</span> <span class="legend-root"></span> <span data-i18n="根提交">根提交</span></div><span data-i18n="点击提交查看详情 · Esc 关闭">点击提交查看详情 · Esc 关闭</span></footer>
    </section>
    <aside id="detail" aria-label="提交详情" data-i18n-aria-label="提交详情" inert><div class="detail-top"><span><span data-i18n="提交详情">提交详情</span> <span id="detailIndex"></span></span><button id="closeDetail" class="icon-button" aria-label="关闭提交详情" data-i18n-aria-label="关闭提交详情" title="关闭 / Esc" data-i18n-title="关闭 / Esc">×</button></div><div id="detailContent"></div></aside>
  </main>
  <div id="status" role="status" class="status hidden"></div>
  <dialog id="writeAccessDialog" class="write-dialog" aria-labelledby="writeAccessTitle">
    <div class="warning-symbol">!</div><h2 id="writeAccessTitle" data-i18n="启用源仓库读写？">启用源仓库读写？</h2>
    <p data-i18n="开启后，可以在源仓库中创建本地 Git 标签，也可以一键撤回本软件创建的全部标签。这些操作会修改仓库的 Git 引用记录。">开启后，可以在源仓库中创建本地 Git 标签，也可以一键撤回本软件创建的全部标签。这些操作会修改仓库的 Git 引用记录。</p>
    <p data-i18n="不会改变工作区文件或当前分支；标签须手动推送到远端。切换仓库或刷新页面后恢复只读。">不会改变工作区文件或当前分支；标签须手动推送到远端。切换仓库或刷新页面后恢复只读。</p>
    <code id="writeAccessRepo"></code><p id="writeAccessError" class="dialog-error" role="status"></p>
    <div class="dialog-actions"><button id="cancelWriteBtn" type="button" data-i18n="保持只读">保持只读</button><button id="enableWriteBtn" type="button" class="enable-write" data-i18n="启用读写">启用读写</button></div>
  </dialog>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body></html>
